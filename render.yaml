services:
  - type: web
    name: stubot
    env: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: OWNER_ID
        sync: false
      - key: STORAGE_CHANNEL_ID
        sync: false
      - key: FORCE_JOIN_CHANNELS
        sync: false
      - key: FORCE_JOIN_CHANNEL_NAMES
        sync: false
      - key: FORCE_JOIN_CHANNEL_LINKS
        sync: false
      - key: REFERRAL_FORCE_JOIN_CHANNELS
        sync: false
      - key: MONETAG_ZONE_ID
        sync: false
      - key: CONTACT_LINK
        sync: false
      - key: UPI_ID
        sync: false
      - key: UPI_NAME
        sync: false
      - key: PAYMENT_GROUP_ID
        sync: false
      - key: LOGS_GROUP_ID
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: DEVPORT_API_KEY
        sync: false
      - key: PAYTM_MID
        sync: false
      - key: PAYTM_MERCHANT_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false